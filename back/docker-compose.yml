# Whole backend on one machine: Postgres, ClamAV and the six services.
# Only the gateway publishes a port; the rest talk on the compose network.
#
#   (JWT keys: npm run jwt:keys)
#   POSTGRES_PASSWORD=… INTERNAL_TOKEN=… JWT_PRIVATE_KEY=… JWT_PUBLIC_KEY=… \
#   AUTH_DB_PASSWORD=… CONTENT_DB_PASSWORD=… STORE_DB_PASSWORD=… docker compose up --build

x-service: &service
  build:
    context: .
  restart: unless-stopped

x-env: &env
  NODE_ENV: production
  PORT: 3000
  API_PREFIX: ${API_PREFIX:-api}
  CORS_ORIGIN: ${CORS_ORIGIN:-*}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  INTERNAL_TOKEN: ${INTERNAL_TOKEN}
  AUTH_URL: http://auth:3000/${API_PREFIX:-api}
  CONTENT_URL: http://content:3000/${API_PREFIX:-api}
  STORE_URL: http://store:3000/${API_PREFIX:-api}
  MEDIA_URL: http://media:3000/${API_PREFIX:-api}
  EVENTS_URL: http://events:3000/${API_PREFIX:-api}
  # Behind Cloudflare: CLIENT_IP_HEADER=cf-connecting-ip (only if the origin is reachable through Cloudflare alone)
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-}
  TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jbskylens}
      POSTGRES_USER: ${POSTGRES_USER:-jbskylens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Per-service roles, created on the first start (db/compose-init.sh)
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD}
      STORE_DB_PASSWORD: ${STORE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/create-roles.sql:/db/create-roles.sql:ro
      - ./db/compose-init.sh:/docker-entrypoint-initdb.d/10-service-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jbskylens}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Antivirus for dashboard uploads (media refuses uploads in production without it).
  # Needs ~2-3 GB RAM for the signatures. For videos over 100 MB raise clamd's
  # StreamMaxLength, MaxFileSize and MaxScanSize (e.g. 1100M) in clamd.conf.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamdb:/var/lib/clamav

  gateway:
    <<: *service
    build: { context: ., args: { APP: gateway } }
    environment:
      <<: *env
    depends_on: [auth, content, store, media, events]
    ports:
      - "${GATEWAY_PORT:-3001}:3000"

  auth:
    <<: *service
    build: { context: ., args: { APP: auth } }
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *env
      DATABASE_URL: postgresql://svc_auth:${AUTH_DB_PASSWORD}@db:5432/${POSTGRES_DB:-jbskylens}?schema=auth
      # Signs access tokens: only auth has it
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}

  content:
    <<: *service
    build: { context: ., args: { APP: content } }
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *env
      DATABASE_URL: postgresql://svc_content:${CONTENT_DB_PASSWORD}@db:5432/${POSTGRES_DB:-jbskylens}?schema=content
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}

  store:
    <<: *service
    build: { context: ., args: { APP: store } }
    depends_on:
      db: { condition: service_healthy }
    environment:
      <<: *env
      DATABASE_URL: postgresql://svc_store:${STORE_DB_PASSWORD}@db:5432/${POSTGRES_DB:-jbskylens}?schema=store
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_WEBHOOK_ID: ${PAYPAL_WEBHOOK_ID:-}

  media:
    <<: *service
    build: { context: ., args: { APP: media } }
    depends_on:
      clamav: { condition: service_started }
    environment:
      <<: *env
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      CLAMAV_HOST: clamav
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PUBLIC_URL: ${S3_PUBLIC_URL:-}

  events:
    <<: *service
    build: { context: ., args: { APP: events } }
    environment:
      <<: *env

volumes:
  pgdata:
  clamdb:
